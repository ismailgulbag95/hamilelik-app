name: aura_pregnancy
description: "Aura Pregnancy - Romantik Anı Günlüğü ve Medikal Takip Uygulaması"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.4.1
  path: ^1.8.3
  intl: ^0.18.1
  google_fonts: ^6.1.0
  flutter_inset_box_shadow: ^1.0.8
  sqflite_common_ffi: ^2.3.4
  image_picker: ^1.1.2
  record: ^5.1.2
  audioplayers: ^6.0.0
  permission_handler: ^11.3.1
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/images/
